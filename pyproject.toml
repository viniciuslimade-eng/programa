[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esteira-superficie"
version = "0.1.0"
description = "Inventário da superfície externa: descoberta, revisão de escopo, sondagem, rastreamento e consolidação"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
esteira-superficie = "esteira_superficie.cli:main"

[tool.setuptools]
packages = ["esteira_superficie"]
